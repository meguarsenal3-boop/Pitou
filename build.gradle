plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Descomente conforme formos integrando os mods que ja estao no seu modpack:
    // GeckoLib (boneca, rabo, poses)
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    // PlayerAnimator (animacoes de corpo do player)
    maven { url 'https://maven.maxhenkel.de/repository/public' }
    // KosmX maven (PlayerAnimator / player-animation-lib)
    maven { url 'https://maven.kosmx.dev/' }
    // CurseMaven (fallback para baixar jars de mod como dependencia de dev)
    maven { url 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ---- Dependencias que vamos ligar nas proximas etapas (ja estao no seu pack) ----
    // GeckoLib 4.8.3:
    // implementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:4.8.3"
    implementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:4.8.3"
    // PlayerAnimator:
    // implementation "dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20"
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20"
    // AzureLib (VFX) e Champions (leitura de afixos) entram via CurseMaven quando precisarmos.
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // ESSENCIAL: reobfusca o jar de mojmap (dev) para SRG (producao).
    // Sem isso, o .jar abre no runClient mas quebra com NoSuchMethodError em qualquer
    // metodo vanilla quando rodado de verdade.
    finalizedBy 'reobfJar'
}
